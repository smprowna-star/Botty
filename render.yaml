services:
  - type: worker
    name: ultimate-discord-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DASHBOARD_SECRET
        generateValue: true
      - key: DASHBOARD_ENABLED
        value: "true"
      - key: WELCOME_CHANNEL_ID
        value: "0"
      - key: TICKET_CATEGORY_ID
        value: "0"
      - key: TICKET_LOG_CHANNEL_ID
        value: "0"
      - key: GUILD_ID
        value: "0"
      - key: DATABASE_PATH
        value: "bot.db"
